<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <!-- 大世界的預設封面：星空下的山與湖 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050916"/>
      <stop offset="0.5" stop-color="#0f1c48"/>
      <stop offset="0.8" stop-color="#22397a"/>
      <stop offset="1" stop-color="#3b5aa8"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8f0ff"/>
      <stop offset="0.55" stop-color="#a9c4ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4a92"/>
      <stop offset="1" stop-color="#070c1f"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fbcff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9fbcff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- 銀河 -->
  <ellipse cx="300" cy="90" rx="330" ry="46" fill="url(#nebula)" transform="rotate(-14 300 90)"/>
  <!-- 星星 -->
  <g fill="#fff">
    <circle cx="70" cy="40" r="1.3" opacity=".9"/><circle cx="150" cy="70" r="0.9" opacity=".7"/><circle cx="240" cy="30" r="1.2"/>
    <circle cx="420" cy="50" r="1" opacity=".8"/><circle cx="520" cy="28" r="1.4"/><circle cx="590" cy="80" r="0.8" opacity=".7"/>
    <circle cx="350" cy="18" r="0.8" opacity=".8"/><circle cx="30" cy="95" r="0.8" opacity=".6"/><circle cx="110" cy="128" r="0.9" opacity=".6"/>
    <circle cx="200" cy="105" r="0.7" opacity=".7"/><circle cx="290" cy="72" r="1" opacity=".9"/><circle cx="330" cy="120" r="0.7" opacity=".6"/>
    <circle cx="460" cy="110" r="0.9" opacity=".7"/><circle cx="560" cy="135" r="0.8" opacity=".6"/><circle cx="615" cy="40" r="1" opacity=".8"/>
    <circle cx="385" cy="85" r="0.6" opacity=".7"/><circle cx="175" cy="20" r="0.7" opacity=".7"/><circle cx="265" cy="150" r="0.6" opacity=".5"/>
  </g>
  <g stroke="#dfe8ff" stroke-width="0.8" opacity="0.8">
    <path d="M520 20 v16 M512 28 h16"/><path d="M240 24 v12 M234 30 h12"/>
  </g>
  <!-- 月亮 -->
  <circle cx="470" cy="150" r="60" fill="url(#moon)"/>
  <circle cx="470" cy="150" r="22" fill="#eef3ff"/>
  <!-- 遠山 -->
  <path d="M0 230 L70 180 L130 205 L210 150 L290 200 L350 170 L430 210 L510 160 L580 195 L640 175 L640 260 L0 260 Z" fill="#2a3f7c" opacity="0.85"/>
  <rect y="190" width="640" height="70" fill="url(#mist)"/>
  <!-- 中景山 -->
  <path d="M0 255 L90 205 L160 240 L240 195 L320 245 L400 215 L470 250 L560 205 L640 240 L640 275 L0 275 Z" fill="#17255a"/>
  <!-- 湖面 -->
  <rect y="268" width="640" height="92" fill="url(#lake)"/>
  <g stroke="#dce7ff" stroke-linecap="round" opacity="0.5">
    <line x1="440" y1="285" x2="500" y2="285" stroke-width="2"/>
    <line x1="452" y1="298" x2="488" y2="298" stroke-width="1.6"/>
    <line x1="461" y1="311" x2="479" y2="311" stroke-width="1.2"/>
  </g>
  <!-- 近景 -->
  <path d="M0 300 L60 270 L120 292 L180 268 L230 295 L0 330 Z" fill="#0b1230"/>
  <path d="M640 290 L580 262 L520 288 L470 275 L430 300 L640 330 Z" fill="#0b1230"/>
  <rect y="328" width="640" height="32" fill="#080d24"/>
</svg>

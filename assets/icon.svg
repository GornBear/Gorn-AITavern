<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AI 酒館的圖示：星空藍底＋發光的啤酒杯。改了這個檔案後執行 npm run icon 重新產生圖示 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#22357a"/>
      <stop offset="0.55" stop-color="#121d4a"/>
      <stop offset="1" stop-color="#090f2b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.47" cy="0.58" r="0.5">
      <stop offset="0" stop-color="#79a8ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#79a8ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#79a8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb43a"/>
      <stop offset="0.45" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#f29a22"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffeec8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>

  <!-- 底：圓角星空 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sky)"/>
  <g clip-path="url(#frame)">
    <circle cx="120" cy="148" r="118" fill="url(#halo)"/>
    <!-- 星星 -->
    <g fill="#ffffff">
      <circle cx="44" cy="52" r="2.6" opacity="0.9"/>
      <circle cx="82" cy="34" r="1.8" opacity="0.7"/>
      <circle cx="36" cy="110" r="2" opacity="0.6"/>
      <circle cx="214" cy="140" r="2.2" opacity="0.7"/>
      <circle cx="226" cy="92" r="1.6" opacity="0.6"/>
      <circle cx="150" cy="30" r="1.6" opacity="0.6"/>
      <circle cx="40" cy="196" r="1.8" opacity="0.5"/>
      <circle cx="218" cy="204" r="1.6" opacity="0.5"/>
    </g>
    <!-- 大的四芒星 -->
    <path d="M196 40 L201 55 L216 60 L201 65 L196 80 L191 65 L176 60 L191 55 Z" fill="#dfe9ff"/>
    <path d="M58 76 L61 84 L69 87 L61 90 L58 98 L55 90 L47 87 L55 84 Z" fill="#c2a8ff"/>
  </g>

  <!-- 杯子的光暈 -->
  <g filter="url(#glow)" opacity="0.85">
    <rect x="68" y="96" width="100" height="120" rx="16" fill="#79a8ff"/>
    <path d="M168 120 h18 a22 22 0 0 1 22 22 v28 a22 22 0 0 1 -22 22 h-18" fill="none" stroke="#79a8ff" stroke-width="16"/>
  </g>

  <!-- 把手 -->
  <path d="M166 122 h18 a20 20 0 0 1 20 20 v28 a20 20 0 0 1 -20 20 h-18" fill="none" stroke="#e8f0ff" stroke-width="13" stroke-linecap="round"/>
  <path d="M166 122 h18 a20 20 0 0 1 20 20 v28 a20 20 0 0 1 -20 20 h-18" fill="none" stroke="#b9cdf5" stroke-width="5" stroke-linecap="round"/>

  <!-- 杯身：玻璃框＋啤酒 -->
  <rect x="66" y="96" width="104" height="124" rx="16" fill="#e8f0ff"/>
  <rect x="74" y="104" width="88" height="108" rx="10" fill="url(#beer)"/>
  <!-- 杯身的直條反光 -->
  <rect x="86" y="118" width="9" height="82" rx="4.5" fill="#fff6d8" opacity="0.75"/>
  <rect x="140" y="118" width="7" height="82" rx="3.5" fill="#c97a12" opacity="0.35"/>
  <!-- 氣泡 -->
  <g fill="#fff4cf" opacity="0.9">
    <circle cx="118" cy="190" r="4"/>
    <circle cx="128" cy="168" r="3"/>
    <circle cx="112" cy="150" r="3.5"/>
    <circle cx="132" cy="136" r="2.5"/>
  </g>

  <!-- 泡沫 -->
  <g fill="url(#foam)">
    <circle cx="80" cy="98" r="18"/>
    <circle cx="104" cy="86" r="22"/>
    <circle cx="132" cy="84" r="21"/>
    <circle cx="157" cy="96" r="17"/>
    <rect x="64" y="94" width="108" height="20" rx="10"/>
  </g>
  <!-- 泡沫往下滴 -->
  <path d="M146 112 v10 a6 6 0 0 0 12 0 v-10 z" fill="#fff8e6"/>
</svg>
